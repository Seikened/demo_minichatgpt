name: Fix removed token strip

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/fix-removed-token-strip.yml
      - tools/fix_removed_token_strip.py

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove stale token-strip access and validate
        run: python tools/fix_removed_token_strip.py
      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && { echo "No changes produced"; exit 1; } || true
          git commit -m "Fix startup after removing token strip"
          git push origin HEAD:master
