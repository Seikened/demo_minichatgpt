name: Apply demo v6

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/apply-demo-v6.yml
      - tools/apply_demo_v6.py

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply and validate presentation polish
        run: python tools/apply_demo_v6.py
      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && { echo "No changes produced"; exit 1; } || true
          git commit -m "Polish presentation layout and credits"
          git push origin HEAD:master
