[project]
name = "demo-mini-chat"
version = "0.3.0"
description = "Visual next-token demo for explaining probabilistic language models."
readme = "README.md"
authors = [
    { name = "Fernando Leon Franco", email = "fernanlee2131@gmail.com" }
]
requires-python = ">=3.14.5"
dependencies = [
    "fastapi>=0.141",
    "numpy>=2.3",
    "pydantic>=2.13",
    "rich>=14.1",
    "safetensors>=0.6",
    "torch>=2.10",
    "transformers>=5.14,<6",
    "uvicorn>=0.52",
]

[project.scripts]
demo-mini-chat = "demo_mini_chat.web:main"
demo-mini-chat-cli = "demo_mini_chat.cli:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
